<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cellar — Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .fc-header {
      position: relative; z-index: 1; text-align: center;
      padding: 4.5rem 1.5rem 1rem;
      animation: fadeUp 0.8s ease-out;
    }
    .fc-header .back-link {
      position: absolute; top: 2rem; left: 1.5rem;
      font-size: 0.85rem; color: var(--text-muted); text-decoration: none;
    }
    .fc-header .back-link:hover { color: var(--wine); }
    .fc-title {
      font-family: var(--font-display); font-size: clamp(2.5rem, 6vw, 3.5rem);
      font-weight: 300; color: var(--sand-light); letter-spacing: 0.1em;
    }
    .fc-subtitle {
      font-family: var(--font-display); font-style: italic;
      font-size: 1rem; color: var(--text-muted); margin-top: 0.3rem;
    }

    /* Filter buttons */
    .fc-controls {
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
      padding: 0 1.5rem 1.5rem; position: relative; z-index: 1;
    }
    .fc-filter-row { display: flex; gap: 0.5rem; }
    .fc-filter-btn {
      font-family: var(--font-body); font-size: 0.8rem; font-weight: 500;
      padding: 0.45rem 1.2rem; border-radius: 100px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-muted); cursor: pointer; transition: all 0.3s;
    }
    .fc-filter-btn:hover { border-color: var(--border-hover); color: var(--text); }
    .fc-filter-btn.active {
      background: var(--wine); color: #fff; border-color: var(--wine);
    }

    /* Progress */
    .fc-progress-wrap {
      width: 100%; max-width: 480px; text-align: center;
    }
    .fc-progress-bar {
      width: 100%; height: 6px; border-radius: 3px;
      background: var(--border); overflow: hidden;
    }
    .fc-progress-fill {
      height: 100%; background: var(--wine); border-radius: 3px;
      transition: width 0.4s ease;
    }
    .fc-progress-text {
      font-size: 0.8rem; color: var(--text-muted); margin-top: 0.4rem;
    }

    /* Card scene */
    .fc-scene {
      perspective: 1000px;
      display: flex; justify-content: center; align-items: center;
      padding: 1rem 1.5rem 2rem; min-height: 380px;
      position: relative; z-index: 1;
    }
    .fc-card {
      width: 100%; max-width: 480px; min-height: 340px;
      cursor: pointer; position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fc-card.flipped { transform: rotateY(180deg); }

    .fc-face {
      position: absolute; inset: 0; backface-visibility: hidden;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface); padding: 2.5rem 2rem;
      display: flex; flex-direction: column; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .fc-back { transform: rotateY(180deg); }

    /* Front */
    .fc-front { justify-content: center; align-items: center; text-align: center; }
    .fc-grape-name {
      font-family: var(--font-display); font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 400; color: var(--sand-light); letter-spacing: 0.04em;
    }
    .fc-type-dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-right: 0.5rem; vertical-align: middle;
    }
    .fc-type-dot.vit { background: var(--gold); }
    .fc-type-dot.rod { background: var(--wine); }
    .fc-tap-hint {
      font-size: 0.75rem; color: var(--text-dim); margin-top: 1.5rem;
      font-style: italic;
    }

    /* Back */
    .fc-back { overflow-y: auto; gap: 1rem; }
    .fc-section-title {
      font-family: var(--font-display); font-size: 0.9rem; font-weight: 600;
      color: var(--wine); text-transform: uppercase; letter-spacing: 0.12em;
      margin-bottom: 0.3rem;
    }
    .fc-section-text {
      font-size: 0.85rem; color: var(--text); line-height: 1.6;
    }
    .fc-section { margin-bottom: 0.2rem; }

    /* SRS buttons */
    .fc-actions {
      display: flex; justify-content: center; gap: 0.6rem;
      padding: 0 1.5rem 2rem; position: relative; z-index: 1;
      flex-wrap: wrap;
    }
    .fc-btn {
      font-family: var(--font-body); font-size: 0.82rem; font-weight: 500;
      padding: 0.6rem 1rem; border-radius: var(--radius-sm);
      border: 1px solid var(--border); cursor: pointer; transition: all 0.25s;
      display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
      min-width: 72px;
    }
    .fc-btn-label { font-size: 0.72rem; color: var(--text-dim); }
    .fc-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .fc-btn-igen { background: var(--surface); color: var(--wine); border-color: var(--wine); }
    .fc-btn-igen:not(:disabled):hover { background: var(--wine); color: #fff; }
    .fc-btn-svart { background: var(--surface); color: var(--text-muted); }
    .fc-btn-svart:not(:disabled):hover { border-color: var(--border-hover); color: var(--text); }
    .fc-btn-bra { background: var(--surface); color: var(--moss); border-color: var(--moss); }
    .fc-btn-bra:not(:disabled):hover { background: var(--moss); color: #fff; }
    .fc-btn-latt { background: var(--moss); color: #fff; border-color: var(--moss); }
    .fc-btn-latt:not(:disabled):hover { background: var(--moss-light); }
    .fc-flip-hint {
      text-align: center; font-size: 0.78rem; color: var(--text-dim);
      font-style: italic; padding-bottom: 1rem; position: relative; z-index: 1;
    }
    .fc-next-info {
      text-align: center; font-size: 0.75rem; color: var(--text-dim);
      padding: 0.3rem 0 0.5rem; position: relative; z-index: 1;
    }
    /* Due badge */
    .fc-due-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.75rem; color: var(--wine); background: rgba(139,26,43,0.08);
      border: 1px solid rgba(139,26,43,0.2); border-radius: 100px;
      padding: 0.2rem 0.7rem; margin-top: 0.5rem;
    }

    /* Completion */
    .fc-done {
      text-align: center; padding: 4rem 2rem; position: relative; z-index: 1;
      animation: fadeUp 0.6s ease-out;
    }
    .fc-done-icon { font-size: 3rem; margin-bottom: 1rem; }
    .fc-done-title {
      font-family: var(--font-display); font-size: 2rem; font-weight: 300;
      color: var(--sand-light); margin-bottom: 0.5rem;
    }
    .fc-done-text { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }
    .fc-btn-restart {
      font-family: var(--font-body); font-size: 0.9rem; font-weight: 500;
      padding: 0.7rem 2rem; border-radius: var(--radius-sm);
      background: var(--wine); color: #fff; border: none; cursor: pointer;
      transition: background 0.3s;
    }
    .fc-btn-restart:hover { background: var(--wine-deep); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8B1A2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div class="bg-grain"></div>

  <header class="fc-header">
    <a href="index.html" class="back-link">&larr; Tillbaka</a>
    <h1 class="fc-title">Flashcards</h1>
    <p class="fc-subtitle">Lär dig druvorna med kort</p>
  </header>

  <div class="fc-controls">
    <div class="fc-filter-row">
      <button class="fc-filter-btn active" data-filter="alla">Alla</button>
      <button class="fc-filter-btn" data-filter="vit">Vita</button>
      <button class="fc-filter-btn" data-filter="röd">Röda</button>
    </div>
    <div class="fc-progress-wrap">
      <div class="fc-progress-bar"><div class="fc-progress-fill" id="progressFill"></div></div>
      <div class="fc-progress-text" id="progressText"></div>
    </div>
  </div>

  <div id="cardArea">
    <div class="fc-scene">
      <div class="fc-card" id="flashcard">
        <div class="fc-face fc-front" id="cardFront"></div>
        <div class="fc-face fc-back" id="cardBack"></div>
      </div>
    </div>
    <div class="fc-flip-hint" id="flipHint">Tryck på kortet för att se svaret</div>
    <div class="fc-actions" id="srsActions">
      <button class="fc-btn fc-btn-igen" id="btnIgen" disabled>
        Igen<span class="fc-btn-label">~1 dag</span>
      </button>
      <button class="fc-btn fc-btn-svart" id="btnSvart" disabled>
        Svårt<span class="fc-btn-label" id="lblSvart"></span>
      </button>
      <button class="fc-btn fc-btn-bra" id="btnBra" disabled>
        Bra<span class="fc-btn-label" id="lblBra"></span>
      </button>
      <button class="fc-btn fc-btn-latt" id="btnLatt" disabled>
        Lätt<span class="fc-btn-label" id="lblLatt"></span>
      </button>
    </div>
    <div class="fc-next-info" id="nextInfo"></div>
  </div>

  <div id="doneArea" style="display:none;"></div>

  <footer class="footer">
    <div class="footer-divider"><span class="divider-vine">✦</span></div>
    <p>Cellar — Byggt för sommelierer</p>
  </footer>

  <script>
  (async () => {
    const SRS_KEY = 'cellar-srs';
    const STREAK_KEY = 'cellar-streak';

    const res = await fetch('data/druvor.json');
    const allGrapes = await res.json();

    let filter = 'alla';
    let deck = [];
    let total = 0;
    let done = 0;
    let flipped = false;

    const card = document.getElementById('flashcard');
    const front = document.getElementById('cardFront');
    const back = document.getElementById('cardBack');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const cardArea = document.getElementById('cardArea');
    const doneArea = document.getElementById('doneArea');
    const flipHint = document.getElementById('flipHint');
    const nextInfo = document.getElementById('nextInfo');
    const btnIgen = document.getElementById('btnIgen');
    const btnSvart = document.getElementById('btnSvart');
    const btnBra = document.getElementById('btnBra');
    const btnLatt = document.getElementById('btnLatt');

    // --- SRS helpers ---
    function getSRS() {
      try { return JSON.parse(localStorage.getItem(SRS_KEY)) || {}; } catch { return {}; }
    }
    function saveSRS(data) {
      try { localStorage.setItem(SRS_KEY, JSON.stringify(data)); } catch {}
    }

    function scheduleCard(grapeNamn, rating) {
      // rating: 0=Igen, 1=Svårt, 2=Bra, 3=Lätt
      const srs = getSRS();
      const c = srs[grapeNamn] || { interval: 0, ef: 2.5 };
      let { interval, ef } = c;
      if (rating === 0) {
        interval = 1;
      } else if (rating === 1) {
        interval = Math.max(1, Math.ceil((interval || 1) * 1.2));
        ef = Math.max(1.3, ef - 0.15);
      } else if (rating === 2) {
        interval = interval === 0 ? 1 : Math.ceil(interval * ef);
      } else {
        interval = interval === 0 ? 4 : Math.ceil(interval * ef * 1.3);
        ef = Math.min(4.0, ef + 0.1);
      }
      const due = Date.now() + interval * 24 * 60 * 60 * 1000;
      srs[grapeNamn] = { interval, ef: Math.round(ef * 100) / 100, due };
      saveSRS(srs);
      return interval;
    }

    function previewInterval(grapeNamn, rating) {
      const srs = getSRS();
      const c = srs[grapeNamn] || { interval: 0, ef: 2.5 };
      let { interval, ef } = c;
      if (rating === 0) return 1;
      if (rating === 1) return Math.max(1, Math.ceil((interval || 1) * 1.2));
      if (rating === 2) return interval === 0 ? 1 : Math.ceil(interval * ef);
      return interval === 0 ? 4 : Math.ceil(interval * ef * 1.3);
    }

    function dueCount(grapes) {
      const srs = getSRS();
      const now = Date.now();
      return grapes.filter(g => { const c = srs[g.namn]; return !c || now >= c.due; }).length;
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildDeck(grapes) {
      const srs = getSRS();
      const now = Date.now();
      const due = [], future = [];
      grapes.forEach(g => {
        const c = srs[g.namn];
        (!c || now >= c.due ? due : future).push(g);
      });
      return [...shuffle(due), ...shuffle(future)];
    }

    function updateStreak() {
      try {
        const today = new Date().toISOString().split('T')[0];
        let s = JSON.parse(localStorage.getItem(STREAK_KEY)) || { count: 0, lastDate: '' };
        const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
        if (s.lastDate === today) return;
        s.count = s.lastDate === yesterday ? s.count + 1 : 1;
        s.lastDate = today;
        localStorage.setItem(STREAK_KEY, JSON.stringify(s));
      } catch {}
    }

    // --- UI ---
    function updateProgress() {
      const pct = total === 0 ? 100 : Math.round((done / total) * 100);
      progressFill.style.width = pct + '%';
      progressText.textContent = done + ' av ' + total + ' genomgångna';
    }

    function setButtons(enabled, grapeNamn) {
      [btnIgen, btnSvart, btnBra, btnLatt].forEach(b => b.disabled = !enabled);
      if (enabled && grapeNamn) {
        document.getElementById('lblSvart').textContent = previewInterval(grapeNamn, 1) + ' d';
        document.getElementById('lblBra').textContent = previewInterval(grapeNamn, 2) + ' d';
        document.getElementById('lblLatt').textContent = previewInterval(grapeNamn, 3) + ' d';
        btnIgen.children[1].textContent = '~1 d';
      }
    }

    function startDeck() {
      const filtered = filter === 'alla' ? [...allGrapes]
        : allGrapes.filter(g => g.typ === (filter === 'röd' ? 'röd' : 'vit'));

      const due = dueCount(filtered);
      deck = buildDeck(filtered);
      total = deck.length;
      done = 0;
      doneArea.style.display = 'none';
      cardArea.style.display = 'block';

      // Show due-badge in progress text area
      const badge = due > 0
        ? `<span class="fc-due-badge">&#128293; ${due} förfallna idag</span>`
        : '';
      progressText.innerHTML = `0 av ${total} genomgångna ${badge}`;
      progressFill.style.width = '0%';

      showCard();
    }

    function showCard() {
      if (deck.length === 0) { showDone(); return; }
      flipped = false;
      card.classList.remove('flipped');
      nextInfo.textContent = '';
      flipHint.style.display = 'block';
      setButtons(false, null);

      const g = deck[0];
      const srs = getSRS();
      const cardData = srs[g.namn];
      const isNew = !cardData;
      const dotClass = g.typ === 'vit' ? 'vit' : 'rod';

      front.innerHTML =
        '<div><span class="fc-type-dot ' + dotClass + '"></span>' +
        '<span class="fc-grape-name">' + g.namn + '</span></div>' +
        (isNew ? '<div class="fc-tap-hint" style="color:var(--wine);font-style:normal;font-size:0.7rem;">Nytt kort</div>' : '') +
        '<div class="fc-tap-hint">Tryck för att vända</div>';

      const aromer = g.aromer
        ? (g.aromer.frukt || '') + (g.aromer.ovrigt ? ', ' + g.aromer.ovrigt : '')
        : '';
      const kar = g.karaktar
        ? ['Syra: ' + (g.karaktar.syra || ''),
           'Kropp: ' + (g.karaktar.kropp || ''),
           'Alkohol: ' + (g.karaktar.alkohol || '')].filter(s => !s.endsWith(': ')).join(' · ')
        : '';
      const reg = g.regioner ? g.regioner.join(', ') : '';
      const mat = g.matparning ? g.matparning.join(', ') : '';

      back.innerHTML =
        sec('Aromer', aromer) + sec('Karaktär', kar) +
        sec('Regioner', reg) + sec('Matparning', mat);

      updateProgress();
    }

    function sec(title, text) {
      if (!text) return '';
      return '<div class="fc-section"><div class="fc-section-title">' + title +
        '</div><div class="fc-section-text">' + text + '</div></div>';
    }

    function rateCard(rating) {
      if (!flipped || deck.length === 0) return;
      const g = deck.shift();
      const days = scheduleCard(g.namn, rating);

      const labels = ['Igen om 1 dag', `Nästa om ${days} dag${days === 1 ? '' : 'ar'}`];
      nextInfo.textContent = rating === 0 ? 'Dyker upp igen snart' : `Nästa repetition om ${days} dag${days === 1 ? '' : 'ar'}`;

      done++;
      updateProgress();

      // small delay so user sees feedback
      setTimeout(showCard, 320);
    }

    function showDone() {
      cardArea.style.display = 'none';
      doneArea.style.display = 'block';
      updateStreak();
      doneArea.innerHTML =
        '<div class="fc-done">' +
        '<div class="fc-done-icon">&#127942;</div>' +
        '<h2 class="fc-done-title">Session klar!</h2>' +
        '<p class="fc-done-text">Du har gått igenom alla kort. Celar schemalägger nästa repetition automatiskt.</p>' +
        '<button class="fc-btn-restart" id="btnRestart">Kör igen</button>' +
        '</div>';
      document.getElementById('btnRestart').addEventListener('click', startDeck);
    }

    card.addEventListener('click', () => {
      if (deck.length === 0) return;
      card.classList.toggle('flipped');
      flipped = card.classList.contains('flipped');
      if (flipped) {
        flipHint.style.display = 'none';
        setButtons(true, deck[0].namn);
      }
    });

    btnIgen.addEventListener('click', () => rateCard(0));
    btnSvart.addEventListener('click', () => rateCard(1));
    btnBra.addEventListener('click', () => rateCard(2));
    btnLatt.addEventListener('click', () => rateCard(3));

    document.querySelectorAll('.fc-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.fc-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filter = btn.dataset.filter;
        startDeck();
      });
    });

    startDeck();
  })();
  </script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/auth.js"></script>

  <script src="js/mobile-nav.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
