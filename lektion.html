<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cellar — Lektion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/lektion.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8B1A2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

  <div class="bg-grain"></div>

  <!-- Pre-test overlay -->
  <div id="pretestWrap" style="display:none;position:relative;z-index:1;max-width:640px;margin:0 auto;padding:4.5rem 1.5rem 2rem;">
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="font-family:var(--font-display);font-size:0.8rem;letter-spacing:0.14em;color:var(--wine);text-transform:uppercase;margin-bottom:0.5rem;">Innan du börjar</div>
      <h2 style="font-family:var(--font-display);font-size:1.8rem;font-weight:300;color:var(--sand-light);">Vad kan du redan?</h2>
      <p style="font-size:0.82rem;color:var(--text-muted);margin-top:0.4rem;">3 snabba frågor — hjärnan lär sig bättre när den försöker först</p>
    </div>
    <div id="pretestBox"></div>
    <div style="text-align:center;margin-top:1.5rem;">
      <button id="pretestSkip" onclick="skipPretest()" style="font-family:var(--font-body);font-size:0.78rem;color:var(--text-dim);background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:3px;">Hoppa över förhandsfrågorna</button>
    </div>
  </div>

  <header class="lektion-header" id="lektionHeader" style="display:none;">
    <a href="index.html" class="back-link"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Tillbaka</a>
    <div class="lektion-badge">Lektion 1 av 19</div>
    <h1 class="lektion-title">Introduktion</h1>
    <p class="lektion-subtitle">I vingården & i vineriet</p>
  </header>

  <nav class="lektion-nav" id="lektionNav" style="display:none;">
    <div class="lektion-nav-inner" id="sectionNav"></div>
  </nav>

  <main class="lektion-content" id="lektionContent" style="display:none;"></main>

  <footer class="footer">
    <div class="footer-divider"><span class="divider-vine">✦</span></div>
    <p>Cellar — Byggt för sommelierer</p>
  </footer>

  <script src="js/lektion.js?v=2"></script>
  <script src="js/mobile-nav.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
